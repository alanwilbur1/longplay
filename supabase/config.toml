# Supabase local development configuration.
# Reference: https://supabase.com/docs/guides/cli/config
project_id = "longplay"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
# Email OTP only — no magic link, no password. The listener receives an
# 8-digit code and types it back into the app. emailRedirectTo is never
# set on the signInWithOtp call so Supabase emits the code alone.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
otp_length = 8
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false

[storage]
enabled = false

[edge_runtime]
enabled = false
